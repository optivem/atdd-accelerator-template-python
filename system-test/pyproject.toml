[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "smoke: marks tests as smoke tests",
    "e2e: marks tests as end-to-end tests",
]